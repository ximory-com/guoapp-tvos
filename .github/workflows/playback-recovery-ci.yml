name: Fork tvOS Validation Build

# Fork-only validation workflow for main and repair branches; NEVER publishes GitHub Releases.
on:
  push:
    branches:
      - main
      - fix/playback-stall-recovery
      - fix/tvos-search-keyboard-focus
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Swift playback and logic tests
        run: swift test --package-path tvos

  tvos-unsigned:
    needs: logic-tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v7
        with:
          go-version-file: upstream/native/go.mod
          cache-dependency-path: upstream/native/go.sum
      - name: Test patched Go media proxy self-recovery
        run: |
          python scripts/apply_fork_overlay.py
          cd upstream/native
          go test ./core -run 'TestNativeStreamRecoverDeadListener' -count=1 -timeout=90s
      - name: Validate tvOS Xcode SDK
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-path
      - name: Build unsigned experimental hongguojian IPA
        run: python scripts/build_tvos.py
      - uses: actions/upload-artifact@v7
        with:
          name: hongguojian-playback-recovery-unsigned
          path: dist/tvos/*-tvos-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
